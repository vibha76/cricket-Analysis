<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f7f8fa"/><g font-family="Arial,sans-serif" fill="#15243a"><text x="42" y="48" font-size="28" font-weight="bold">SOUTH AFRICA'S WICKET CONTRIBUTORS</text><text x="42" y="78" font-size="15" fill="#657287">Bowler-credited wickets across Australia's two innings (20 wickets in total)</text><rect x="30" y="110" width="1140" height="400" rx="16" fill="#fff"/><g font-size="17"><text x="70" y="180">M Jansen</text><text x="70" y="245">K Rabada</text><text x="70" y="310">P W A Mulder</text><text x="70" y="375">SR Harmer</text><text x="70" y="440">A Nortje</text></g><g><rect x="260" y="153" width="540" height="28" rx="5" fill="#2887f5"/><rect x="260" y="218" width="540" height="28" rx="5" fill="#2887f5"/><rect x="260" y="283" width="450" height="28" rx="5" fill="#2887f5"/><rect x="260" y="348" width="180" height="28" rx="5" fill="#2887f5"/><rect x="260" y="413" width="90" height="28" rx="5" fill="#2887f5"/></g><g font-size="19" font-weight="bold"><text x="815" y="175">6</text><text x="815" y="240">6</text><text x="725" y="305">5</text><text x="455" y="370">2</text><text x="365" y="435">1</text></g><text x="930" y="210" font-size="15" fill="#657287">Jansen: 5 + 1</text><text x="930" y="245" font-size="15" fill="#657287">Rabada: 2 + 4</text><text x="930" y="280" font-size="15" fill="#657287">Mulder: 2 + 3</text><text x="930" y="315" font-size="14" fill="#657287">Figures combine innings 1 and 2</text><text x="70" y="480" font-size="13" fill="#657287">Wickets are derived from dismissal events credited to the bowler; run-outs and other non-bowler dismissals are excluded.</text></g></svg>