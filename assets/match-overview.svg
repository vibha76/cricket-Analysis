<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f7f8fa"/><g font-family="Arial,sans-serif" fill="#15243a"><text x="42" y="48" font-size="28" font-weight="bold">INNINGS SCORE &amp; BATTING PRESSURE</text><text x="42" y="78" font-size="15" fill="#657287">South Africa set 425; Australia made 99 and 295</text><rect x="30" y="105" width="700" height="500" rx="16" fill="#fff"/><text x="60" y="145" font-size="21" font-weight="bold">Runs scored by innings</text><g stroke="#e5e9ef"><path d="M90 520H680M90 430H680M90 340H680M90 250H680M90 160H680"/></g><g fill="#657287" font-size="13"><text x="55" y="525">0</text><text x="45" y="435">100</text><text x="45" y="345">200</text><text x="45" y="255">300</text><text x="45" y="165">400</text></g><g><rect x="160" y="138" width="95" height="382" rx="6" fill="#2887f5"/><rect x="350" y="431" width="95" height="89" rx="6" fill="#f26d45"/><rect x="540" y="254" width="95" height="266" rx="6" fill="#f26d45"/></g><g font-size="20" font-weight="bold" text-anchor="middle"><text x="207" y="125">425/9d</text><text x="397" y="418">99</text><text x="587" y="241">295</text></g><g font-size="15" text-anchor="middle" fill="#334155"><text x="207" y="550">South Africa</text><text x="207" y="573">1st innings</text><text x="397" y="550">Australia</text><text x="397" y="573">1st innings</text><text x="587" y="550">Australia</text><text x="587" y="573">2nd innings</text></g><rect x="750" y="105" width="420" height="500" rx="16" fill="#fff"/><text x="780" y="145" font-size="21" font-weight="bold">Dot-ball rate</text><text x="780" y="172" font-size="13" fill="#657287">Share of deliveries with zero total runs</text><g font-size="15" fill="#334155"><text x="780" y="235">South Africa batting</text><text x="780" y="335">Australia · 1st innings</text><text x="780" y="435">Australia · 2nd innings</text></g><g><rect x="780" y="250" width="330" height="22" rx="6" fill="#e9edf2"/><rect x="780" y="250" width="232" height="22" rx="6" fill="#2887f5"/><rect x="780" y="350" width="330" height="22" rx="6" fill="#e9edf2"/><rect x="780" y="350" width="263" height="22" rx="6" fill="#f26d45"/><rect x="780" y="450" width="330" height="22" rx="6" fill="#e9edf2"/><rect x="780" y="450" width="245" height="22" rx="6" fill="#f26d45"/></g><g font-size="19" font-weight="bold"><text x="1020" y="269">70.2%</text><text x="1050" y="369">79.7%</text><text x="1032" y="469">74.3%</text></g><text x="780" y="535" font-size="14" fill="#657287">Higher dot-ball rate = fewer scoring deliveries.</text><text x="780" y="558" font-size="14" fill="#657287">Australia faced the greatest pressure in innings one.</text></g></svg>